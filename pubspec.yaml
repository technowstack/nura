name: nura
description: Aplikasi Islami offline-first.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  crypto: ^3.0.6
  super_sliver_list: ^0.4.1
  connectivity_plus: ^7.3.2
  adhan: ^2.0.0+1
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  home_widget: ^0.10.0
  just_audio: ^0.10.6
  material_symbols_icons: ^4.2960.0
  hijri: ^3.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/db/content.db
    - assets/db/content.version
    - data-source/meta/prayer_regions.json
    - assets/fonts/PlusJakartaSans/OFL.txt
    - assets/fonts/ScheherazadeNew/OFL.txt
  fonts:
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/ScheherazadeNew/ScheherazadeNew-Regular.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.ttf
          weight: 600
